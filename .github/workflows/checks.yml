name: Validate skill
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_release.py
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: skill-bundle
          path: dist/
